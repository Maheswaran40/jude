<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <h1 id="name-heading">welcome to my shop</h1>

    <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#searchCanvas">search</button>
    <button class="btn btn-info" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">cart</button>

        <div class="offcanvas offcanvas-top" style="height: 500px;" id="searchCanvas">
            <div class="offcanvas-header">
                <h1>search</h1><button class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body container">
                <form class="input-group" onsubmit="searchFun(event)">
                    <input type="search" class="form-control" id="input">
                    <button class="btn btn-success">search</button>
                </form>

                <br><br><br>


                <div class="row" id="searchOutput">
                    
                </div>

            </div>
        </div>


        <div class="offcanvas offcanvas-top" id="cartCanvas" style="height: 600px;">
            <div class="offcanvas-header">
                <h1>Cart List</h1>
                <button class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>product</th>
                            <th>name</th>
                            <th>price</th>
                            <th>quantity</th>
                            <th>action</th>
                        </tr>
                    </thead>
                    <tbody id="cartData">
                        
                    </tbody>
                </table>
            </div>
        </div>


    <div class="container">
        <div class="row" id="showProducts">
            
        </div>
    </div>






</body>
<script src="../script/index.js"></script>
</html>
